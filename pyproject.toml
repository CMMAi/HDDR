[project]
name = "compliance-checker"
version = "0.1.0"
description = "Construction compliance checking system for engineering drawings."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langchain-community>=0.4.1",
    "neo4j>=6.1.0",
    "openai>=2.30.0",
    "pillow>=12.1.1",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "loguru>=0.7.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.33",
]

[project.scripts]
build-kg = "compliance_checker.kg:main"
run-ablation = "compliance_checker.ablation.experiments:main"
pdf-to-png = "compliance_checker.pdf_to_png:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_checker"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "PTH", "TRY", "EM", "COM", "PLC", "PLR", "RUF"]
ignore = ["COM812"]

[tool.pytest.ini_options]
addopts = "--cov=src/compliance_checker --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/compliance_checker"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonPath = "src"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
